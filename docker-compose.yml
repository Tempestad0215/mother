version: '3.8'

services:
    # ==========================================
    # Backend PHP-FPM (Imagen Real Autocontenida)
    # ==========================================
    laravel.app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mother-app
        restart: always
        volumes:
            - ./public:/var/www/html/public  # Montar public para desarrollo
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        env_file:
            - .env
        expose:
            - "9000"
        networks:
            - api-net

    # ==========================================
    # Servidor Web Nginx
    # ==========================================
    nginx:
        image: nginx:alpine
        container_name: mother-nginx
        restart: always
        ports:
            - "8090:8090"
        volumes:
            # Configuración de Nginx
            - ./docker/default.conf:/etc/nginx/conf.d/default.conf
            # 🔴 IMPORTANTE: Montar el código para que Nginx pueda servirlo
            - ./public:/var/www/html/public
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            - laravel.app
        networks:
            - api-net

networks:
    api-net:
        external: true
