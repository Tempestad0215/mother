version: '3.8'

services:
    laravel-app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/app  # Sincroniza tu proyecto local con el contenedor
            - /app/vendor # Asegura que el directorio vendor no genere conflictos
            - /app/node_modules # Evita sincronización no deseada de node_modules
        ports:
            - "8000:8000"
        environment:
            - APP_ENV=local
